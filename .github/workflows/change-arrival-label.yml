name: Change arrival label

on:
  push:
    paths:
      - '.github/workflows/change-arrival-label.yml'

permissions:
  contents: write

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<strong>Recommended arrival</strong><div><h3>Recommended arrival window</h3>'
          new = '<strong>Let\'s start from here</strong><div><h3>Recommended arrival window</h3>'
          if old not in s:
              raise SystemExit('Target arrival label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Change arrival label to Let's start from here"
          git push
