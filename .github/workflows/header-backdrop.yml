name: Set full couple photo header backdrop

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set header backdrop without cropping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = ".hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:120px 24px 80px;position:relative;overflow:hidden;border-bottom-left-radius:55px;border-bottom-right-radius:55px;box-shadow:0 18px 50px rgba(80,120,135,.1);background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,250,248,.88)),radial-gradient(circle at 50% 30%,rgba(169,213,230,.3),transparent 42%)}"
          new = ".hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:120px 24px 80px;position:relative;overflow:hidden;border-bottom-left-radius:55px;border-bottom-right-radius:55px;box-shadow:0 18px 50px rgba(80,120,135,.1);background-image:linear-gradient(rgba(255,250,248,.48),rgba(255,250,248,.62)),url('couple-photo.jpg');background-size:auto 100%;background-position:center;background-repeat:no-repeat;background-color:var(--cream)}"
          if old not in html:
              raise SystemExit("Expected hero CSS was not found; no change made.")
          html = html.replace(old, new, 1)
          html = html.replace(".couple-photo{display:block;width:min(100%,420px);height:auto;margin:30px auto 20px;border-radius:28px;box-shadow:0 18px 45px rgba(80,120,135,.16)}", ".couple-photo{display:none}", 1)
          html = html.replace("<div class=\"scroll\">Scroll to explore</div>", "", 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/header-backdrop.yml
          git commit -m "Use full couple photo as header backdrop"
          git push
