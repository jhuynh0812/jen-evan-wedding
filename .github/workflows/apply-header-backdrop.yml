name: Apply wedding header backdrop

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-backdrop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply photo backdrop styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = "</style>"
          css = """
          /* Wedding photo header backdrop */
          .hero{
            background-image:linear-gradient(rgba(255,250,248,.50),rgba(255,250,248,.64)),url('couple-photo.jpg');
            background-size:cover;
            background-position:center 74%;
            background-repeat:no-repeat;
          }
          .hero > *{position:relative;z-index:2}
          .hero:before,.hero:after{z-index:1}
          .couple-photo{display:none!important}
          .hero h1,.hero .names,.hero .date,.hero p,.hero .cta,.hero .kicker{text-shadow:0 1px 12px rgba(255,255,255,.55)}
          @media(max-width:760px){
            .hero{background-position:center center}
          }
          """

          if "/* Wedding photo header backdrop */" not in html:
              if marker not in html:
                  raise SystemExit("Could not find the closing style tag in index.html")
              html = html.replace(marker, css + "\n" + marker, 1)
              path.write_text(html, encoding="utf-8")
          else:
              print("Backdrop styling already present; no change needed.")
          PY

      - name: Commit the finished change and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-header-backdrop.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use couple photo as wedding header backdrop"
          git push
