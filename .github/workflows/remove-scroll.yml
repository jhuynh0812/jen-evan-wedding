name: Remove scroll label

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Remove Scroll to explore label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = '<div class="scroll">Scroll to explore</div>'
          if old in html:
              html = html.replace(old, '', 1)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-scroll.yml
          git commit -m "Remove Scroll to explore label"
          git push
