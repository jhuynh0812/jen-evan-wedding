name: Update April 30 travel details

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-apr30:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update April 30 section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = '''To get there, taking a sleeper bus is the best option. It’s comfortable for the long journey and extremely affordable, usually around $9–$11. You’ll arrive in Rạch Giá City, An Giang, where we recommend staying since there are no hotel accommodations in the village.<br><br>On the wedding day, there will be several transportation options to take you from Rạch Giá to the village for our Lễ Tân Hôn celebration. We’ll help make sure you know how to get there and get settled.'''
          new = '''To get there, taking a sleeper bus is the best option. It’s comfortable for the long journey and extremely affordable, usually around $9–$11. You can take the sleeper bus from <strong>Bến Xe Miền Tây</strong> in Ho Chi Minh City to <strong>Bến Xe Rạch Giá</strong> through FUTA Bus (Xe Phương Trang).<br><br><a class="map-link" href="https://futabus.vn/" target="_blank">↗ FUTA Bus (Xe Phương Trang)</a><br><a class="map-link" href="https://maps.app.goo.gl/MhqjvHxwiMuzBLPY8" target="_blank">↗ Bến Xe Miền Tây — 395 Đ. Kinh Dương Vương, An Lạc, Hồ Chí Minh 700000</a><br><a class="map-link" href="https://maps.app.goo.gl/w6Z1ARoU54VoviTJ6" target="_blank">↗ Bến Xe Rạch Giá</a><br><br>For accommodation, you can use Airbnb to find a condo in Rạch Giá. We recommend staying in Rạch Giá since there are no hotel accommodations in the village.<br><br>On the wedding day, there will be several transportation options to take you from Rạch Giá to the village for our Lễ Tân Hôn celebration. We’ll help make sure you know how to get there and get settled.'''
          if old not in html:
              raise SystemExit("Expected April 30 text was not found; no changes made.")
          html = html.replace(old, new, 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-apr30.yml
          git commit -m "Add April 30 bus and accommodation details"
          git push
